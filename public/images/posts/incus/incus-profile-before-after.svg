<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 700" width="400" height="824" role="img" aria-labelledby="title desc">
  <title id="title">기본 프로파일 설정 전후</title>
  <desc id="desc">설정 전 user-1000-gui 프로젝트의 default 프로파일은 devices가 비어 있어 새 인스턴스에 루트 디스크와 NIC가 지정되지 않는다. 설정 후에는 eth0 nic 디바이스가 네트워크 incusbr-1000을, root disk 디바이스가 Btrfs 스토리지 풀 mq_pool을 가리킨다. 이 프로파일을 상속한 새 인스턴스 test-ub는 incusbr-1000에 연결되고 mq_pool에 루트 디스크가 만들어진다.</desc>
  <style>
    .t{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1f2937}
    .m{font-family:ui-monospace,'JetBrains Mono','D2Coding',Menlo,Consolas,monospace;fill:#1f2937}
    .mu{fill:#4b5563}
    .p{fill:#ffffff;stroke:#d6dce4}
    .pu{fill:#5b21b6}
    .gr{fill:#166534}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d4fd1"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="339" height="699" rx="12" fill="#fbfcfd" stroke="#d6dce4"/>
  <text class="t" x="20" y="34" font-size="19" font-weight="700">기본 프로파일 설정 전후</text>
  <text class="t mu" x="20" y="56" font-size="14">user-1000-gui의 default 프로파일 · 예시</text>

  <!-- 설정 전 -->
  <rect class="p" x="16" y="72" width="308" height="144" rx="10"/>
  <text class="t" x="30" y="96" font-size="16" font-weight="700">설정 전</text>
  <rect x="30" y="108" width="280" height="44" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text class="m" x="44" y="136" font-size="15">devices: {}</text>
  <text class="t mu" x="30" y="178" font-size="14">루트 디스크 · NIC가 지정되지 않음</text>
  <text class="t" x="30" y="200" font-size="14" style="fill:#991b1b">→ 인스턴스 생성이 실패할 수 있음</text>

  <path d="M170 220V244" stroke="#6b7280" stroke-width="2" marker-end="url(#an)"/>

  <!-- 설정 후 -->
  <rect class="p" x="16" y="248" width="308" height="160" rx="10"/>
  <text class="t" x="30" y="272" font-size="16" font-weight="700">설정 후</text>
  <rect x="30" y="284" width="280" height="40" rx="6" fill="#f3eeff" stroke="#7c5cd6"/>
  <text class="m" x="42" y="309" font-size="14.5"><tspan font-weight="700">eth0</tspan> → incusbr-1000</text>
  <text class="t pu" x="298" y="309" font-size="14" text-anchor="end">nic</text>
  <rect x="30" y="332" width="280" height="40" rx="6" fill="#eaf7ef" stroke="#2f9e5e"/>
  <text class="m" x="42" y="357" font-size="14.5"><tspan font-weight="700">root</tspan> → mq_pool</text>
  <text class="t gr" x="298" y="357" font-size="14" text-anchor="end">disk · /</text>
  <text class="t mu" x="30" y="396" font-size="14">새 인스턴스가 두 디바이스를 상속</text>

  <!-- 참조 리소스 -->
  <path d="M91 408V444" stroke="#6d4fd1" stroke-width="2" marker-end="url(#ap)"/>
  <text class="m pu" x="99" y="431" font-size="14">network</text>
  <path d="M249 408V444" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text class="m gr" x="257" y="431" font-size="14">pool</text>

  <rect x="16" y="448" width="150" height="60" rx="8" fill="#f3eeff" stroke="#7c5cd6"/>
  <text class="t pu" x="91" y="471" font-size="14" text-anchor="middle">network</text>
  <text class="m" x="91" y="494" font-size="14" font-weight="700" text-anchor="middle">incusbr-1000</text>
  <rect x="174" y="448" width="150" height="60" rx="8" fill="#eaf7ef" stroke="#2f9e5e"/>
  <text class="t gr" x="249" y="471" font-size="14" text-anchor="middle">storage · btrfs</text>
  <text class="m" x="249" y="494" font-size="14" font-weight="700" text-anchor="middle">mq_pool</text>

  <path d="M91 508V536" stroke="#6d4fd1" stroke-width="2" marker-end="url(#ap)"/>
  <path d="M249 508V536" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>

  <!-- 새 인스턴스 -->
  <rect x="16" y="540" width="308" height="86" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t" x="30" y="564" font-size="15" font-weight="700">새 인스턴스 (예: <tspan class="m">test-ub</tspan>)</text>
  <text class="m" x="30" y="588" font-size="14">eth0 → incusbr-1000에 연결</text>
  <text class="m" x="30" y="610" font-size="14">root → mq_pool에 생성</text>

  <text class="t mu" x="170" y="656" font-size="14" text-anchor="middle">root의 pool → 루트 스토리지 풀 결정</text>
  <text class="t mu" x="170" y="678" font-size="14" text-anchor="middle">eth0의 network → 연결 네트워크 결정</text>
</svg>
