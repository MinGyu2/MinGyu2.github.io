<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 476" width="720" height="476" role="img" aria-labelledby="title desc">
  <title id="title">기본 프로파일 설정 전후</title>
  <desc id="desc">설정 전 user-1000-gui 프로젝트의 default 프로파일은 devices가 비어 있어 새 인스턴스에 루트 디스크와 네트워크 인터페이스가 지정되지 않는다. 설정 후에는 eth0 nic 디바이스가 네트워크 incusbr-1000을, root disk 디바이스가 Btrfs 스토리지 풀 mq_pool을 가리키며, 이 프로파일을 상속한 새 인스턴스는 incusbr-1000에 연결되고 mq_pool에 루트 디스크가 만들어진다.</desc>
  <style>
    .t{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1f2937}
    .m{font-family:ui-monospace,'JetBrains Mono','D2Coding',Menlo,Consolas,monospace;fill:#1f2937}
    .mu{fill:#4b5563}
    .p{fill:#ffffff;stroke:#d6dce4}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d4fd1"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="475" rx="12" fill="#fbfcfd" stroke="#d6dce4"/>
  <text class="t" x="32" y="40" font-size="20" font-weight="700">기본 프로파일 설정 전후</text>
  <text class="t mu" x="32" y="62" font-size="13">프로젝트 user-1000-gui의 default 프로파일 · 이름은 예시</text>

  <!-- 설정 전 -->
  <rect class="p" x="24" y="84" width="300" height="180" rx="10"/>
  <text class="t" x="40" y="110" font-size="15" font-weight="700">설정 전</text>
  <rect x="40" y="122" width="268" height="56" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text class="m" x="56" y="156" font-size="14">devices: {}</text>
  <text class="t mu" x="40" y="206" font-size="13">디바이스가 없어 새 인스턴스에</text>
  <text class="t mu" x="40" y="226" font-size="13">루트 디스크와 NIC가 지정되지 않음</text>
  <text class="t" x="40" y="248" font-size="13" style="fill:#991b1b">→ 인스턴스 생성이 실패할 수 있음</text>

  <path d="M332 174H388" stroke="#6b7280" stroke-width="2" marker-end="url(#an)"/>

  <!-- 설정 후 -->
  <rect class="p" x="396" y="84" width="300" height="180" rx="10"/>
  <text class="t" x="412" y="110" font-size="15" font-weight="700">설정 후</text>
  <rect x="412" y="122" width="268" height="40" rx="6" fill="#f3eeff" stroke="#7c5cd6"/>
  <text class="m" x="426" y="147" font-size="13.5"><tspan font-weight="700">eth0</tspan> → incusbr-1000</text>
  <text class="t" x="668" y="147" font-size="12" text-anchor="end" style="fill:#5b21b6">nic</text>
  <rect x="412" y="172" width="268" height="40" rx="6" fill="#eaf7ef" stroke="#2f9e5e"/>
  <text class="m" x="426" y="197" font-size="13.5"><tspan font-weight="700">root</tspan> → mq_pool</text>
  <text class="t" x="668" y="197" font-size="12" text-anchor="end" style="fill:#166534">disk · path: /</text>
  <text class="t mu" x="412" y="240" font-size="13">새 인스턴스가 두 디바이스를 상속</text>

  <!-- 참조 -->
  <path d="M466 264V312" stroke="#6d4fd1" stroke-width="2" marker-end="url(#ap)"/>
  <text class="m" x="474" y="294" font-size="12" style="fill:#5b21b6">network</text>
  <path d="M626 264V312" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <text class="m" x="634" y="294" font-size="12" style="fill:#166534">pool</text>

  <rect x="396" y="316" width="140" height="80" rx="8" fill="#f3eeff" stroke="#7c5cd6"/>
  <text class="t" x="466" y="342" font-size="12" text-anchor="middle" style="fill:#5b21b6">network</text>
  <text class="m" x="466" y="366" font-size="14" font-weight="700" text-anchor="middle">incusbr-1000</text>
  <text class="t mu" x="466" y="386" font-size="11.5" text-anchor="middle">기존 네트워크</text>
  <rect x="556" y="316" width="140" height="80" rx="8" fill="#eaf7ef" stroke="#2f9e5e"/>
  <text class="t" x="626" y="342" font-size="12" text-anchor="middle" style="fill:#166534">storage pool</text>
  <text class="m" x="626" y="366" font-size="14" font-weight="700" text-anchor="middle">mq_pool</text>
  <text class="t mu" x="626" y="386" font-size="11.5" text-anchor="middle">btrfs</text>

  <!-- 상속 결과 -->
  <path d="M412 264V290H174V312" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#an)"/>
  <text class="t mu" x="292" y="284" font-size="12" text-anchor="middle">프로파일 적용</text>
  <rect x="24" y="316" width="300" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
  <text class="t" x="40" y="340" font-size="14" font-weight="700">새 인스턴스 (예: <tspan class="m">test-ub</tspan>)</text>
  <text class="m" x="40" y="362" font-size="12.5">eth0 → incusbr-1000에 연결</text>
  <text class="m" x="40" y="382" font-size="12.5">root → mq_pool에 생성</text>

  <text class="t mu" x="360" y="432" font-size="13" text-anchor="middle">root 디스크의 pool 값이 새 인스턴스의 루트 스토리지 풀을 결정</text>
  <text class="t mu" x="360" y="454" font-size="13" text-anchor="middle">eth0의 network 값이 연결할 네트워크를 결정</text>
</svg>
