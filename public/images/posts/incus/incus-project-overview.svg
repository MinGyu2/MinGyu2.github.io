<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 824" width="400" height="969" role="img" aria-labelledby="title desc">
  <title id="title">Incus 프로젝트 구성도</title>
  <desc id="desc">하나의 Incus 서버 안에 위쪽의 기존 프로젝트 user-1000과 아래쪽의 신규 프로젝트 user-1000-gui가 있다. 각 프로젝트는 자체 default 프로파일과 인스턴스를 가진다. 가운데에는 프로젝트 소유가 아닌 서버 수준 리소스가 있다. user-1000 프로파일의 root 디바이스는 default 스토리지 풀을, user-1000-gui 프로파일의 root 디바이스는 Btrfs 스토리지 풀 mq_pool을 참조하고, 두 프로파일의 eth0 디바이스는 모두 공유 네트워크 incusbr-1000을 참조한다.</desc>
  <style>
    .t{font-family:'Pretendard','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#1f2937}
    .m{font-family:ui-monospace,'JetBrains Mono','D2Coding',Menlo,Consolas,monospace;fill:#1f2937}
    .mu{fill:#4b5563}
    .pj{fill:#eef4ff;stroke:#2563eb}
    .pf{fill:#f3f4f6;stroke:#6b7280}
    .in{fill:#ffffff;stroke:#9aa4b2}
    .st{fill:#eaf7ef;stroke:#2f9e5e}
    .nw{fill:#f3eeff;stroke:#7c5cd6}
    .bl{fill:#1e40af}
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6d4fd1"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="339" height="823" rx="12" fill="#fbfcfd" stroke="#d6dce4"/>
  <text class="t" x="20" y="34" font-size="19" font-weight="700">Incus 프로젝트 구성도</text>
  <text class="t mu" x="20" y="56" font-size="14">이름은 예시이며 환경마다 다를 수 있음</text>

  <rect x="10" y="72" width="320" height="680" rx="10" fill="none" stroke="#9aa4b2" stroke-dasharray="5 4"/>
  <text class="t mu" x="24" y="94" font-size="14" font-weight="700">Incus 서버</text>

  <!-- 기존 프로젝트 (위) -->
  <rect class="pj" x="40" y="106" width="260" height="178" rx="10"/>
  <text class="m bl" x="54" y="130" font-size="15" font-weight="700">user-1000</text>
  <text class="t bl" x="286" y="130" font-size="14" text-anchor="end">기존 프로젝트</text>
  <rect class="in" x="54" y="144" width="232" height="36" rx="6"/>
  <text class="t" x="170" y="167" font-size="14" text-anchor="middle">인스턴스 A · 인스턴스 B</text>
  <path d="M170 180V192" stroke="#6b7280" stroke-width="1.5" marker-end="url(#an)"/>
  <rect class="pf" x="54" y="196" width="232" height="76" rx="8"/>
  <text class="t" x="68" y="218" font-size="15" font-weight="700">profile: default</text>
  <text class="m" x="68" y="240" font-size="14">eth0 → incusbr-1000</text>
  <text class="m" x="68" y="261" font-size="14">root → default</text>

  <!-- 서버 수준 리소스 (가운데) -->
  <rect class="st" x="70" y="318" width="200" height="56" rx="8"/>
  <text class="t" x="170" y="340" font-size="14" text-anchor="middle" style="fill:#166534">storage pool</text>
  <text class="m" x="170" y="362" font-size="15" font-weight="700" text-anchor="middle">default</text>
  <rect class="nw" x="70" y="394" width="200" height="56" rx="8"/>
  <text class="t" x="170" y="416" font-size="14" text-anchor="middle" style="fill:#5b21b6">network (공유)</text>
  <text class="m" x="170" y="438" font-size="15" font-weight="700" text-anchor="middle">incusbr-1000</text>
  <rect class="st" x="70" y="470" width="200" height="56" rx="8"/>
  <text class="t" x="170" y="492" font-size="14" text-anchor="middle" style="fill:#166534">storage pool · btrfs</text>
  <text class="m" x="170" y="514" font-size="15" font-weight="700" text-anchor="middle">mq_pool</text>

  <!-- 신규 프로젝트 (아래) -->
  <rect class="pj" x="40" y="560" width="260" height="178" rx="10"/>
  <rect class="pf" x="54" y="572" width="232" height="76" rx="8"/>
  <text class="t" x="68" y="594" font-size="15" font-weight="700">profile: default</text>
  <text class="m" x="68" y="616" font-size="14">eth0 → incusbr-1000</text>
  <text class="m" x="68" y="637" font-size="14">root → mq_pool</text>
  <path d="M170 662V652" stroke="#6b7280" stroke-width="1.5" marker-end="url(#an)"/>
  <rect class="in" x="54" y="662" width="232" height="36" rx="6"/>
  <text class="t" x="170" y="685" font-size="14" text-anchor="middle"><tspan class="m">test-ub</tspan> · 새 인스턴스</text>
  <text class="m bl" x="54" y="724" font-size="15" font-weight="700">user-1000-gui</text>
  <text class="t bl" x="286" y="724" font-size="14" text-anchor="end">신규 프로젝트</text>

  <!-- 참조 화살표 -->
  <path d="M170 272V314" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M286 234H314V422H274" stroke="#6d4fd1" stroke-width="2" fill="none" marker-end="url(#ap)"/>
  <path d="M170 572V530" stroke="#15803d" stroke-width="2" marker-end="url(#ag)"/>
  <path d="M54 610H26V422H66" stroke="#6d4fd1" stroke-width="2" fill="none" marker-end="url(#ap)"/>

  <text class="t mu" x="170" y="782" font-size="14" text-anchor="middle">스토리지 풀 · 네트워크는 서버 리소스이며</text>
  <text class="t mu" x="170" y="804" font-size="14" text-anchor="middle">프로파일 디바이스가 이름으로 참조</text>
</svg>
